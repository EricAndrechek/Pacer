name: Pacer
options:
  bundleIdPrefix: com.ericandrechek
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: YZXWMJ5VBY
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_LDFLAGS: "-Wl,-no_warn_duplicate_libraries"
    # xcodebuild builds the bundles unsigned; bin/dev-install.sh
    # signs everything afterwards with Developer ID Application.
    #
    # We deliberately bypass Xcode's signing flow because:
    #   - Apple Development (auto-provisioned) signing produces a
    #     csreq-less TCC.db row for kTCCServiceSystemPolicyAppData,
    #     so the "Pacer would like to access data from other apps"
    #     prompt re-fires on every launch (AGENTS.md bug #6).
    #   - Switching to Manual + Developer ID Application inside
    #     project.yml runs into Xcode demanding a Developer ID
    #     provisioning profile for the App Groups capability,
    #     which would force the user to register a profile in the
    #     Apple Developer portal.
    # Direct codesign sidesteps both: the Mach-O carries the
    # Developer ID Application cert chain (matching what the
    # eventual Sparkle release will look like) without any portal
    # round-trip, and TCC writes a populated csreq blob so the
    # Allow click sticks across launches.
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    # Disable Xcode 16+'s "Debug Dylib Support". With it on, Debug
    # builds produce a tiny stub binary that loads the real @main from
    # `<Target>.debug.dylib` at launch — fast for Xcode incremental
    # builds, but breaks WidgetKit extension loading. chronod (the
    # Sequoia widget daemon) launches the .appex and the stub aborts
    # with `_abort_swift_entry_main_entry_point_not_found___debug_dylib`,
    # so the gallery shows zero Pacer widgets even though pluginkit
    # registers the bundle. Disabling the indirection makes the
    # widget binary self-contained, which is what the install flow
    # needs anyway (we sign + notarize + staple — there's no
    # incremental-debug benefit to preserve).
    ENABLE_DEBUG_DYLIB: NO
    # SwiftUI Previews' generated `__preview.dylib` is a similar
    # development-only artifact that bloats the bundle and triggers
    # extra signing complexity in `bin/dev-install.sh`. Off here for
    # the same reason — `make install` builds for daily-driver use,
    # not Xcode preview canvases.
    ENABLE_PREVIEWS: NO

packages:
  PacerCore:
    path: PacerCore
  Sparkle:
    # Sparkle 2.x auto-update framework. Released DMGs ship a signed
    # appcast (EdDSA / Ed25519) hosted on GitHub Pages; the app polls
    # it on launch and every 6h via SPUStandardUpdaterController.
    # See docs/releasing.md for the keypair + secrets setup.
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Pacer:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"   # hand-managed below — see the `info:` block
      # The widget *views* are also compiled into the app (not just the
      # PacerWidgets extension) so the headless screenshot generator
      # (`App/Background/ScreenshotMode.swift`) can render them with fake
      # entries for the README gallery. Exclude the extension's `@main`
      # bundle + its plist/entitlements — only the view/entry/support
      # types are wanted here.
      - path: Widgets
        excludes:
          - "Info.plist"
          - "PacerWidgets.entitlements"
          - "PacerWidgetsBundle.swift"
    # Hand-managed Info.plist (vs GENERATE_INFOPLIST_FILE) so we can
    # carry Sparkle's keys (SUFeedURL, SUPublicEDKey, SUEnableAutomaticChecks).
    # Xcode's auto-generation only knows about the INFOPLIST_KEY_* aliases
    # for Apple's own keys; Sparkle's keys would silently drop.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pacer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026 Eric Andrechek"
        # LSUIElement=true makes Pacer launch as a macOS "agent" app
        # by default: no Dock icon, no menu-bar app menu, but visible
        # menu-bar status item (the SwiftUI MenuBarExtra) and visible
        # windows when the user opens them. Pacer's AppDelegate
        # promotes activation policy to .regular when a main window
        # is visible (so the user has a Dock icon to Cmd+Q from) and
        # demotes back to .accessory when the last window closes
        # (so closed-window state is invisible but data collection
        # continues). This is the same shape Stats/Raycast/Rectangle
        # use — see docs/research/tcc-app-management.md for why we
        # adopted it.
        LSUIElement: true
        # Sparkle's appcast feed. GitHub Pages serves the appcast.xml
        # generated by the release workflow from the `gh-pages` branch
        # (or the root of `main`, depending on Pages config).
        SUFeedURL: https://ericandrechek.github.io/Pacer/appcast.xml
        # Sparkle's EdDSA public key. Matches the private key stored in
        # the SPARKLE_ED_PRIVATE_KEY GitHub Actions secret; the keypair
        # was generated via Sparkle's `generate_keys` and lives in the
        # maintainer's Keychain under `ed25519`. See docs/releasing.md
        # if you need to rotate.
        SUPublicEDKey: iCjiSrk4yhkum2eWbamefoJ9vxQh2oDhGIQwo+pEHLY=
        # Check on launch and every 6h thereafter. The user can override
        # both in the in-app updater prefs (rendered by Sparkle's standard
        # UI) and via `defaults write com.ericandrechek.pacer SUEnableAutomaticChecks 0`.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
        # Download + install updates silently in the background by default
        # (Sparkle applies them on the agent's next relaunch). Users who turn
        # off automatic updates in the updater prefs keep the prompt-first flow.
        SUAutomaticallyUpdate: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericandrechek.pacer
        PRODUCT_NAME: Pacer
        CODE_SIGN_ENTITLEMENTS: App/Pacer.entitlements
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        # --- DuckDB archive SPIKE (branch: spike/duckdb-integration) ---
        # The immutable columnar archive of raw rows (see docs + the
        # ArchiveSpike). Links `Vendor/DuckDB.xcframework`: DuckDB v1.5.5
        # built from source for arm64 against MACOSX_DEPLOYMENT_TARGET=15.0
        # with BUILD_SHELL/BUILD_UNITTESTS off, extension autoloading off,
        # and DuckDB's own empty `CORE_EXTENSIONS` default (so no parquet /
        # json / icu / autocomplete). No Homebrew, so CI and contributors
        # build unchanged.
        #
        # The widget extension deliberately does NOT link it — widgets read
        # SwiftData rollups only, so their memory budget is untouched.
        SWIFT_OBJC_BRIDGING_HEADER: App/Archive/PacerArchiveBridge.h
        OTHER_LDFLAGS: $(inherited) -lc++ -Wl,-dead_strip
    dependencies:
      - package: PacerCore
        product: PacerCore
      - package: PacerCore
        product: PacerUI
      - package: Sparkle
        product: Sparkle
      - target: PacerWidgets
      # Static XCFramework — linked into the app binary, so there is no
      # dylib to embed, re-sign, or subject to library validation under
      # the hardened runtime.
      - framework: Vendor/DuckDB.xcframework
        embed: false

  PacerWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"   # generated below; not a Swift source
    # Hand-managed Info.plist instead of GENERATE_INFOPLIST_FILE +
    # INFOPLIST_KEY_*. Xcode's auto-generation didn't surface the
    # `NSExtension` dict from `INFOPLIST_KEY_NSExtensionPointIdentifier`,
    # which left the .appex undiscoverable by WidgetKit (pluginkit -m
    # showed nothing; widget gallery was empty). Explicit Info.plist
    # with the NSExtension entry fixes it.
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pacer Widgets
        # Match the parent app's version — required by macOS, otherwise
        # xcodebuild warns and chronod may refuse to register the appex.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericandrechek.pacer.widgets
        PRODUCT_NAME: PacerWidgets
        CODE_SIGN_ENTITLEMENTS: Widgets/PacerWidgets.entitlements
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: PacerCore
        product: PacerCore
      - package: PacerCore
        product: PacerUI
      # AppIntents.framework is required for `AppIntentConfiguration`
      # widgets — without an explicit link, `appintentsmetadataprocessor`
      # skips metadata extraction at build time and the long-press
      # picker on the configured widget shows no parameters, even
      # though everything compiles.
      - sdk: AppIntents.framework
