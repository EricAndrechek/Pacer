name: Pacer
options:
  bundleIdPrefix: com.ericandrechek
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: YZXWMJ5VBY
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_LDFLAGS: "-Wl,-no_warn_duplicate_libraries"
    # xcodebuild builds the bundles unsigned; bin/dev-install.sh
    # signs everything afterwards with Developer ID Application.
    #
    # We deliberately bypass Xcode's signing flow because:
    #   - Apple Development (auto-provisioned) signing produces a
    #     csreq-less TCC.db row for kTCCServiceSystemPolicyAppData,
    #     so the "Pacer would like to access data from other apps"
    #     prompt re-fires on every launch (AGENTS.md bug #6).
    #   - Switching to Manual + Developer ID Application inside
    #     project.yml runs into Xcode demanding a Developer ID
    #     provisioning profile for the App Groups capability,
    #     which would force the user to register a profile in the
    #     Apple Developer portal.
    # Direct codesign sidesteps both: the Mach-O carries the
    # Developer ID Application cert chain (matching what the
    # eventual Sparkle release will look like) without any portal
    # round-trip, and TCC writes a populated csreq blob so the
    # Allow click sticks across launches.
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

packages:
  PacerCore:
    path: PacerCore

targets:
  Pacer:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericandrechek.pacer
        PRODUCT_NAME: Pacer
        CODE_SIGN_ENTITLEMENTS: App/Pacer.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Eric Andrechek"
        INFOPLIST_KEY_CFBundleDisplayName: Pacer
        # LSUIElement=true makes Pacer launch as a macOS "agent" app
        # by default: no Dock icon, no menu-bar app menu, but visible
        # menu-bar status item (the SwiftUI MenuBarExtra) and visible
        # windows when the user opens them. Pacer's AppDelegate
        # promotes activation policy to .regular when a main window
        # is visible (so the user has a Dock icon to Cmd+Q from) and
        # demotes back to .accessory when the last window closes
        # (so closed-window state is invisible but data collection
        # continues). This is the same shape Stats/Raycast/Rectangle
        # use — see docs/research/tcc-app-management.md for why we
        # adopted it.
        INFOPLIST_KEY_LSUIElement: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: PacerCore
        product: PacerCore
      - target: PacerWidgets

  PacerWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"   # generated below; not a Swift source
    # Hand-managed Info.plist instead of GENERATE_INFOPLIST_FILE +
    # INFOPLIST_KEY_*. Xcode's auto-generation didn't surface the
    # `NSExtension` dict from `INFOPLIST_KEY_NSExtensionPointIdentifier`,
    # which left the .appex undiscoverable by WidgetKit (pluginkit -m
    # showed nothing; widget gallery was empty). Explicit Info.plist
    # with the NSExtension entry fixes it.
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pacer Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericandrechek.pacer.widgets
        PRODUCT_NAME: PacerWidgets
        CODE_SIGN_ENTITLEMENTS: Widgets/PacerWidgets.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: PacerCore
        product: PacerCore
