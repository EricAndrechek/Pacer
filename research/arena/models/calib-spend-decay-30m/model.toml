name = "calib-spend-decay-30m"
description = "spend-decay-30m with its meter ranges recalibrated around its own median (kit/calib.py), learned from its own out-of-sample backtests: per window and lead bin, shrunk toward no change."
targets = ["meter.five_hour"]
children = ["spend-decay-30m"]
deps = []
weights = []

[config]
child = "spend-decay-30m"
method = "scale"           # scale | crps | pit | both (kit/calib.py)
n0 = 8.0                   # forecast origins at which the pooled fit gets half its weight
n0_bin = 8.0               # ... and a lead bin's own fit, toward the pooled one
s_max = 3.0                # scale factors stay in [1 / s_max, s_max]
min_origins = 3
per_bin = 8                # truth readings per forecast and lead bin
round = true               # whole points when the child's paths are whole

[config.backtest_every_h]
five_hour = 2
seven_day = 8
weekly_scoped = 8

[config.backtest_n]        # latest origins per cadence, each a fresh fit of the child
five_hour = 24
seven_day = 24
weekly_scoped = 24
