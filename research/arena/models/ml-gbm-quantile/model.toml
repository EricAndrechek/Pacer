name = "ml-gbm-quantile"
description = "LightGBM quantile regression of the meter's remaining rise at a lead (fraction of the time left), trained walk-forward on the history's own past cutoffs; quantiles become comonotone paths."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = []
deps = ["lightgbm>=4.5"]

[config]
levels = [0.03, 0.1, 0.25, 0.5, 0.75, 0.9, 0.97]
max_rows = 3000           # walk-forward cutoffs per window kind (each with up to 8 leads)
min_rows = 60             # fewer: the burn fallback
retrain_h = 24            # retrain once this much new data has arrived (long runs)
n_estimators = 150
learning_rate = 0.05
num_leaves = 15
min_child_samples = 20
weekly_num_leaves = 7     # seven-day and scoped meters have far fewer cycles
weekly_min_child_samples = 10
calibrate_folds = 3       # out-of-fold rescaling of each level's spread (whole cycles per fold); 0 = off
default_scale = [1.2, 1.2, 1.1, 1.0, 1.3, 1.7, 2.0]   # prior per level: in-sample quantiles are too narrow, most in the tails
prior_cycles = 10         # weight of the prior, in cycles
min_cycles = 4            # fewer cycles to learn from: the burn fallback
