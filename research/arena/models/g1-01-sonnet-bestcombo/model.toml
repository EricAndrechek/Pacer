name = "g1-01-sonnet-bestcombo"
description = "EWA combination of the best available meter models: fm-timestral-123m-meter (best individual) + fm-timestral-209m-meter (2nd best) + ml-qrf (ML baseline for diversity). Adapts online as readings arrive."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = ["fm-timestral-123m-meter", "fm-timestral-209m-meter", "ml-qrf"]

[config]
children = ["fm-timestral-123m-meter", "fm-timestral-209m-meter", "ml-qrf"]
pool = "mixture"
eta = 0.5
half_life_n = 12
backtest_every_h = { five_hour = 3, seven_day = 12, weekly_scoped = 12 }
backtest_n = 4
max_evals = 16
