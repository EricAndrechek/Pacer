name = "g1-02-haiku-fm-ensemble"
description = "Learned stacking of top foundation models (Timestral 209M/28M, Chronos2, Moirai2) for meter targets with per-target adaptive weighting."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = ["fm-timestral-209m-meter", "fm-timestral-28m-meter", "fm-chronos2-meter", "fm-moirai2-meter"]

[config]
children = ["fm-timestral-209m-meter", "fm-timestral-28m-meter", "fm-chronos2-meter", "fm-moirai2-meter"]
pool = "mixture"
shrink = 0.05
half_life_n = 48
backtest_every_h = { five_hour = 3, seven_day = 12, weekly_scoped = 12 }
backtest_n = 6
max_evals = 16
