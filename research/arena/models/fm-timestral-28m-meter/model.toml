name = "fm-timestral-28m-meter"
description = "Timestral-28M (Mistral AI), zero-shot, on the meter's cumulative burn (this cycle after the previous ones), resampled; quantiles to the reset as meter paths."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = []
deps = ["torch==2.10.0", "safetensors>=0.4", "huggingface_hub>=0.28"]
weights = ["mistralai/Timestral-28M@49b26409ac87b5935539a5d8ffe7f397b720db47"]

[config]
backend = "timestral"
weights = "mistralai/Timestral-28M@49b26409ac87b5935539a5d8ffe7f397b720db47"
threads = 4
stale_min = 120

[config.step_min]
five_hour = 5
seven_day = 15
weekly_scoped = 15

[config.context_steps]
# Timestral-28M on the visible tier: 12 h (5-min steps) beat 3 h and 6 h for the 5-hour meter,
# matched 1 day; 3 days (15-min steps) matched 1 week for the weekly meters.
five_hour = 144
seven_day = 288
weekly_scoped = 288
