name = "g1-02-haiku-fm-meter-stack"
description = "Learned stacking of foundation models (Timestral 209M, Chronos2, Moirai2) with per-target adaptive weighting minimizing CRPS."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = ["fm-timestral-209m-meter", "fm-chronos2-meter", "fm-moirai2-meter"]

[config]
children = ["fm-timestral-209m-meter", "fm-chronos2-meter", "fm-moirai2-meter"]
pool = "mixture"
shrink = 0.05
half_life_n = 48
backtest_every_h = { five_hour = 3, seven_day = 12, weekly_scoped = 12 }
backtest_n = 4
max_evals = 16
