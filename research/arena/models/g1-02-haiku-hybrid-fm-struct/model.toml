name = "g1-02-haiku-hybrid-fm-struct"
description = "Hybrid ensemble combining direct FM meter forecasts with structural models (spend→meter conversion) for complementary views."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = ["fm-timestral-209m-meter", "fm-chronos2-meter", "struct-timestral-28m", "struct-chronos2"]

[config]
children = ["fm-timestral-209m-meter", "fm-chronos2-meter", "struct-timestral-28m", "struct-chronos2"]
pool = "mixture"
shrink = 0.05
half_life_n = 48
backtest_every_h = { five_hour = 3, seven_day = 12, weekly_scoped = 12 }
backtest_n = 4
max_evals = 16
