name = "fm-timestral-209m-meter"
description = "Timestral-209M (Mistral AI), zero-shot, on the meter's cumulative burn (this cycle after the previous ones), resampled; quantiles to the reset as meter paths."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = []
deps = ["torch==2.10.0", "safetensors>=0.4", "huggingface_hub>=0.28"]
weights = ["mistralai/Timestral-209M@9874d252ab0aae16f7f7c999f98f98d6ad7d8365"]

[config]
backend = "timestral"
weights = "mistralai/Timestral-209M@9874d252ab0aae16f7f7c999f98f98d6ad7d8365"
threads = 4
stale_min = 120

[config.step_min]
five_hour = 5
seven_day = 15
weekly_scoped = 15

[config.context_steps]
# Timestral-28M on the visible tier: 12 h (5-min steps) beat 3 h and 6 h for the 5-hour meter,
# matched 1 day; 3 days (15-min steps) matched 1 week for the weekly meters.
five_hour = 144
seven_day = 288
weekly_scoped = 288
