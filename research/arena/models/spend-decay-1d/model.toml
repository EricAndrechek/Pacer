name = "spend-decay-1d"
description = "The lab's weekly tokm-decay-1d: live value plus the last day of converted burn, in-cycle calibrated, fading with a τ learned walk-forward (mean error at reset) per account and half of the window; paths from past errors at the same phase."
targets = ["meter.seven_day", "meter.scoped"]
children = []

[config]
lookback_min = 1440
case_days = 120
phase_band = 0.10

[config.default_tau_h]
five_hour = 2.0
seven_day = 16.0
weekly_scoped = 16.0
