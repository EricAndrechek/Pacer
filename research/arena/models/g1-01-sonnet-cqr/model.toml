name = "g1-01-sonnet-cqr"
description = "LightGBM quantile regression with split conformalized calibration: trains on the first 80% of cycles, calibrates on the last 20%, adjusts intervals to guarantee empirical coverage."
targets = ["meter.five_hour", "meter.scoped"]
children = []
deps = ["lightgbm>=4.5"]

[config]
levels = [0.03, 0.1, 0.25, 0.5, 0.75, 0.9, 0.97]
default_scale = [2.5, 2.0, 1.4, 1.0, 1.4, 2.0, 2.5]
min_rows = 200
min_cycles = 20
n_estimators = 150
calibrate_folds = 3
prior_cycles = 8
