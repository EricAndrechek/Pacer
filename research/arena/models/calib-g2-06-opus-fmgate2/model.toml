name = "calib-g2-06-opus-fmgate2"
description = "g2-06-opus-fmgate2 with its meter ranges recalibrated around its own median (kit/calib.py), learned from its own out-of-sample backtests: per window and lead bin, shrunk toward no change."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = ["g2-06-opus-fmgate2"]
deps = []
weights = []

[config]
child = "g2-06-opus-fmgate2"
method = "scale"           # scale | crps | pit | both (kit/calib.py)
n0 = 8.0                   # forecast origins at which the pooled fit gets half its weight
n0_bin = 8.0               # ... and a lead bin's own fit, toward the pooled one
s_max = 3.0                # scale factors stay in [1 / s_max, s_max]
min_origins = 3
per_bin = 8                # truth readings per forecast and lead bin
round = true               # whole points when the child's paths are whole

[config.backtest_every_h]
five_hour = 2
seven_day = 8
weekly_scoped = 8

[config.backtest_n]        # latest origins per cadence, each a fresh fit of the child
five_hour = 12
seven_day = 12
weekly_scoped = 12
