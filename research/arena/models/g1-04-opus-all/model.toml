name = "g1-04-opus-all"
description = "Comprehensive ML model: LightGBM quantile regression for meters (with OOF recalibration), spend, tokens; simple baselines for split and cycle.next_start."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped", "spend.hourly", "tokens.hourly", "split.accounts", "cycle.next_start"]
children = []
deps = ["lightgbm>=4.5"]

[config]
# Meter settings (based on ml-gbm-quantile with improvements)
meter_levels = [0.03, 0.1, 0.25, 0.5, 0.75, 0.9, 0.97]
default_scale = [3.0, 2.0, 1.2, 1.0, 1.5, 2.5, 4.0]
prior_cycles = 3
max_rows = 3000
min_rows = 60
retrain_h = 24
n_estimators = 180
learning_rate = 0.04
num_leaves = 12
min_child_samples = 15
weekly_num_leaves = 5
weekly_min_child_samples = 10
weekly_n_estimators = 120
calibrate_folds = 2
min_cycles = 4
min_spread_7d = 3.0
min_spread_scoped = 1.0

# Spend/tokens settings
spend_context_hours = 672
tokens_context_hours = 336
spend_levels = [0.02, 0.05, 0.1, 0.2, 0.35, 0.5, 0.65, 0.8, 0.9, 0.95, 0.98]
spend_n_estimators = 120
spend_num_leaves = 10
spend_min_child_samples = 25
rho = 0.6
train_hours = 3000
spend_cap_factor = 3.0
tokens_cap_factor = 3.0
spend_spread_mult = 2.0
tokens_spread_mult = 1.8
