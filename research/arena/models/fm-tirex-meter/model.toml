name = "fm-tirex-meter"
description = "TiRex (NX-AI, 35M xLSTM), zero-shot, on the meter's cumulative burn (this cycle after the previous ones), resampled; quantiles to the reset as meter paths."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = []
deps = ["torch==2.10.0", "tirex-ts==1.4.2", "huggingface_hub>=0.28"]
weights = ["NX-AI/TiRex@63c740922493f5fbe60b277609ec62babfba2762"]

[config]
backend = "tirex"
weights = "NX-AI/TiRex@63c740922493f5fbe60b277609ec62babfba2762"
threads = 4
stale_min = 120

[config.step_min]
five_hour = 5
seven_day = 15
weekly_scoped = 15

[config.context_steps]
# The lab's default context, 1 day / 1 week (not tuned here).
five_hour = 288
seven_day = 672
weekly_scoped = 672
