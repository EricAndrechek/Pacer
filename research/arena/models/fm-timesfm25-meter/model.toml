name = "fm-timesfm25-meter"
description = "TimesFM 2.5 (Google, 200M), zero-shot, on the meter's cumulative burn (this cycle after the previous ones), resampled; quantiles to the reset as meter paths."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = []
deps = ["torch==2.10.0", "timesfm[torch]==3.0.2", "safetensors>=0.4", "huggingface_hub>=0.28"]
weights = ["google/timesfm-2.5-200m-pytorch@1d952420fba87f3c6dee4f240de0f1a0fbc790e3"]

[config]
backend = "timesfm25"
weights = "google/timesfm-2.5-200m-pytorch@1d952420fba87f3c6dee4f240de0f1a0fbc790e3"
threads = 4
stale_min = 120

[config.step_min]
five_hour = 5
seven_day = 15
weekly_scoped = 15

[config.context_steps]
# The lab's default context, 1 day / 1 week (not tuned here).
five_hour = 288
seven_day = 672
weekly_scoped = 672
