name = "g2-06-opus-fmgate"
description = "In-process leaders with account-state gating: g1-08-opus-fm's recalibrated Timestral meters (sharpened, then held at the reading while the account is idle or limit-blocked, until a resume time drawn from its own past idle stretches) and Timestral-28M spend; g1-09-opus-split; g1-10-fable-analog next start."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped", "cycle.next_start", "spend.hourly", "tokens.hourly", "split.accounts"]
children = []
deps = ["torch==2.10.0", "safetensors>=0.4", "huggingface_hub>=0.28"]
weights = ["mistralai/Timestral-123M@5a147287addda85f6acd8da3fb8858fe9af7e8f7", "mistralai/Timestral-28M@49b26409ac87b5935539a5d8ffe7f397b720db47"]

# per window: shrink the meter paths' spread around their median, then gate (gate.py)
[config.gate.five_hour]
shrink = 0.8
on = true
min_idle_min = 5
keep = 0.1
mode = "shift"
recency_days = 30
bw_hour = 2.5
other_weight = 3.0

[config.gate.seven_day]
shrink = 0.8
on = true
min_idle_min = 5
keep = 0.2
mode = "shift"
recency_days = 30
bw_hour = 2.5
other_weight = 3.0

[config.gate.weekly_scoped]
shrink = 0.8
on = true
min_idle_min = 5
keep = 0.1
mode = "cut"
recency_days = 30
bw_hour = 2.5
other_weight = 3.0

# ---- g1-08-opus-fm's config (meters, spend, tokens)
[config.g108]
hourly_mode = "fm"         # fm: in-process Timestral-28M | children: Vincentized [config.hourly] children (declare them)

[config.g108.meter_blend]
# window = ["child", weight]: meter paths averaged rank by rank with a child's (the child must be
# declared in `children`). Off: a 50/50 blend with spend-decay-1d lost to the FM alone on scoped
# (seeds 1, 3) and cut cover80 from ~0.93 to ~0.6.

[config.g108.meter]
backend = "timestral"
weights = "mistralai/Timestral-123M@5a147287addda85f6acd8da3fb8858fe9af7e8f7"
threads = 2
stale_min = 120
calibrate = true
cal_n0 = 30
cal_refresh_h = 24
prior_strength = 0.5
cal_age_tau_d = 45

[config.g108.meter.spread_k]
# widening around the calibrated median (70 paired cuts, seed 12): weekly crps -0.11/-0.14 at 1.3,
# 5h cover80 0.77 -> 0.86 at 1.15 (crps +0.01)
five_hour = 1.15
seven_day = 1.3
weekly_scoped = 1.3

[config.g108.meter.step_min]
five_hour = 5
seven_day = 15
weekly_scoped = 15

[config.g108.meter.context_steps]
# 5h: 2 days of 5-min steps beat 12 h (crps -0.23 ± 0.10, 118 paired cuts) and 1 day (-0.17)
five_hour = 576
seven_day = 288
weekly_scoped = 288

[config.g108.meter.cal_every_min]
five_hour = 60
seven_day = 180
weekly_scoped = 180

[config.g108.meter.cal_cuts]
# weekly: 360 cuts (60 days) with age tau 45 d beat 240 / 30 d on 7d limit calls
# (brier -0.010 +- 0.003, crps_ttl -0.54 +- 0.19, 68 cuts)
five_hour = 200
seven_day = 360
weekly_scoped = 360

