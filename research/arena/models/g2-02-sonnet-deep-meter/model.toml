name = "g2-02-sonnet-deep-meter"
description = "3-layer deep stack: calibrate123 (wraps 123m-meter), TimesFM-2.5, Timestral-209m, spend-decay-1d. Adaptive stack for 5h/7d (FM only, decay-1d excluded); fixed domain weights for scoped (decay-1d=0.90, FM share 0.10). Analog-meter removed: its 7d CRPS=1.49 confused the seven_day optimizer."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = [
  "g1-01-sonnet-calibrate123",
  "fm-timesfm25-meter",
  "fm-timestral-209m-meter",
  "spend-decay-1d",
]
deps = []

[config]
children = [
  "g1-01-sonnet-calibrate123",
  "fm-timesfm25-meter",
  "fm-timestral-209m-meter",
  "spend-decay-1d",
]
pool = "mixture"
shrink = 0.05
half_life_n = { five_hour = 24, seven_day = 48, weekly_scoped = 48 }
backtest_every_h = { five_hour = 4, seven_day = 12, weekly_scoped = 12 }
backtest_n = 4
max_evals = 12
