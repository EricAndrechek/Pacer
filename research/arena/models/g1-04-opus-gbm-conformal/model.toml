name = "g1-04-opus-gbm-conformal"
description = "LightGBM quantile regression with improved regularization for weekly meters, OOF spread-scaling calibration, and tuned hyperparameters."
targets = ["meter.five_hour", "meter.seven_day", "meter.scoped"]
children = []
deps = ["lightgbm>=4.5"]

[config]
levels = [0.03, 0.1, 0.25, 0.5, 0.75, 0.9, 0.97]
default_scale = [3.0, 2.0, 1.2, 1.0, 1.5, 2.5, 4.0]
prior_cycles = 3
max_rows = 3000
min_rows = 60
retrain_h = 24
n_estimators = 180
learning_rate = 0.04
num_leaves = 12
min_child_samples = 15
weekly_num_leaves = 5
weekly_min_child_samples = 10
weekly_n_estimators = 120
calibrate_folds = 2
min_cycles = 4
min_spread_7d = 3.0
min_spread_scoped = 1.0
