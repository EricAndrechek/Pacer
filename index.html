<!-- Pacer's site moved to https://pacer.andrechek.com/ (2026-11-25). GitHub Pages
     can't send a 301, so this page says so three ways: the canonical link (search
     engines move the page's ranking there), an instant refresh, and a script.
     appcast.xml and price-history.json beside this file stay: Pacer 0.9.3 and
     older read the update feed from here (docs/releasing.md, "The update feed"). -->
<link rel="canonical" href="https://pacer.andrechek.com/">
<meta http-equiv="refresh" content="0; url=https://pacer.andrechek.com/">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>location.replace("https://pacer.andrechek.com/" + location.hash);</script>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-height: 100vh;
         display: grid; place-items: center; padding: 0 16px; background: #fff; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #0c1116; color: #e6e6e6; } a { color: #6cb6ff; } }
</style>
</head>
