<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6E45E2"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#00C6FB"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="100" y1="100" x2="100" y2="553" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gaugeSweep" x1="253" y1="574" x2="771" y2="574" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D158"/>
      <stop offset="55%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <radialGradient id="centerCap" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E8FF"/>
    </radialGradient>
    <filter id="needleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8.82"/>
      <feOffset dx="0" dy="4.94"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle background + glossy top highlight -->
  <rect x="100" y="100" width="824" height="824" rx="184.33" ry="184.33" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184.33" ry="184.33" fill="url(#topGloss)"/>

  <!-- Tick marks -->
    <line x1="272.5" y1="774.8" x2="251.5" y2="792.4" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="8.82" stroke-linecap="round"/>
  <line x1="228.6" y1="441.6" x2="203.8" y2="430.1" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="8.82" stroke-linecap="round"/>
  <line x1="512.0" y1="261.1" x2="512.0" y2="233.7" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="8.82" stroke-linecap="round"/>
  <line x1="795.4" y1="441.6" x2="820.2" y2="430.1" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="8.82" stroke-linecap="round"/>
  <line x1="751.5" y1="774.8" x2="772.5" y2="792.4" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="8.82" stroke-linecap="round"/>

  <!-- Gauge track -->
  <path d="M 313.80 740.11 A 258.74 258.74 0 1 1 710.20 740.11" fill="none" stroke="#FFFFFF" stroke-opacity="0.20"
        stroke-width="72.51" stroke-linecap="round"/>

  <!-- Active sweep -->
  <path d="M 313.80 740.11 A 258.74 258.74 0 0 1 646.03 352.49" fill="none" stroke="url(#gaugeSweep)"
        stroke-width="72.51" stroke-linecap="round"/>

  <!-- Needle -->
  <g filter="url(#needleShadow)">
    <polygon points="491.56,561.42 638.35,365.17 532.44,586.18"
             fill="#FFFFFF"/>
  </g>

  <!-- Center cap -->
  <circle cx="512.00" cy="573.80" r="30.49" fill="url(#centerCap)"/>
  <circle cx="512.00" cy="573.80" r="11.29" fill="#3B82F6"/>
</svg>
