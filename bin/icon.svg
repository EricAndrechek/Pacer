<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6E45E2"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#00C6FB"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="563" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gaugeSweep" x1="190" y1="589" x2="834" y2="589" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D158"/>
      <stop offset="55%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <radialGradient id="centerCap" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E8FF"/>
    </radialGradient>
    <filter id="needleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle + glossy top highlight -->
  <rect x="0" y="0" width="1024" height="1024" rx="226" ry="226" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="226" ry="226" fill="url(#topGloss)"/>

  <!-- Tick marks -->
    <line x1="214.0" y1="838.8" x2="188.0" y2="860.7" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  <line x1="159.4" y1="424.4" x2="128.6" y2="410.0" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  <line x1="512.0" y1="199.8" x2="512.0" y2="165.8" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  <line x1="864.6" y1="424.4" x2="895.4" y2="410.0" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  <line x1="810.0" y1="838.8" x2="836.0" y2="860.7" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>

  <!-- Gauge track -->
  <path d="M 265.33 795.78 A 322 322 0 1 1 758.67 795.78" fill="none" stroke="#FFFFFF" stroke-opacity="0.20"
        stroke-width="90" stroke-linecap="round"/>

  <!-- Active sweep -->
  <path d="M 265.33 795.78 A 322 322 0 0 1 678.80 313.37" fill="none" stroke="url(#gaugeSweep)"
        stroke-width="90" stroke-linecap="round"/>

  <!-- Needle (with subtle drop shadow) -->
  <g filter="url(#needleShadow)">
    <polygon points="486.34,573.26 669.48,328.77 537.66,604.34"
             fill="#FFFFFF"/>
  </g>

  <!-- Center cap -->
  <circle cx="512" cy="589" r="38" fill="url(#centerCap)"/>
  <circle cx="512" cy="589" r="14" fill="#3B82F6"/>
</svg>
