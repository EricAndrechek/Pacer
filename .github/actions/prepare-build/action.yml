name: Prepare Pacer build
description: >-
  Everything a Pacer build needs before xcodebuild — XcodeGen, resolved SPM
  packages, and the generated project — with caching so PR, main, and release
  runs all pay the same (small) cost.

inputs:
  generate-project:
    description: Run `xcodegen generate` (skip for SPM-only jobs).
    required: false
    default: "true"
  duckdb:
    description: >-
      Restore or build the DuckDB XCFramework the app target links. Its own
      input rather than a rider on `generate-project`: the release workflow
      passes generate-project=false (it stamps the version into project.yml
      first and generates afterwards) and so silently skipped DuckDB, which
      failed the release at link time with the framework missing. Only turn
      this off for jobs that never build the app target.
    required: false
    default: "true"
  forecast-weights:
    description: >-
      Restore or fetch the forecast networks the app target bundles
      (Vendor/ForecastWeights, bin/fetch-forecast-weights.sh). The app's
      resources name the folder, so every job that builds the app target
      needs it; only turn it off for jobs that never do.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # ---- XcodeGen ---------------------------------------------------------
    # `brew install xcodegen` resolves taps and can take 30-60s. The project
    # ships a prebuilt binary per release, so fetch that instead — pinned,
    # deterministic, and a couple of seconds.
    - name: Install XcodeGen
      shell: bash
      env:
        XCODEGEN_VERSION: "2.44.1"
      run: |
        set -euo pipefail
        if command -v xcodegen >/dev/null 2>&1; then
          echo "xcodegen already present: $(xcodegen --version)"; exit 0
        fi
        curl -fsSL -o /tmp/xcodegen.zip \
          "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
        unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
        sudo mkdir -p /usr/local/bin /usr/local/share
        sudo cp -R /tmp/xcodegen/xcodegen/bin/* /usr/local/bin/
        sudo cp -R /tmp/xcodegen/xcodegen/share/* /usr/local/share/
        xcodegen --version

    # ---- Swift packages ---------------------------------------------------
    # Sparkle is fetched and compiled on every clean build otherwise. Keyed on
    # the resolved versions so a dependency bump invalidates it, and on the
    # local package manifest so a PacerCore change does too.
    - name: Cache Swift packages
      uses: actions/cache@v6
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/.swiftpm
          PacerCore/.build
        key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml', 'PacerCore/Package.swift', 'PacerCore/Package.resolved') }}
        restore-keys: |
          spm-${{ runner.os }}-${{ runner.arch }}-

    # ---- DuckDB -----------------------------------------------------------
    # The app links a static DuckDB XCFramework for its raw-row archive. The
    # artifact is ~78 MB, so it is NOT committed (that would land in git
    # history forever, once per version bump) — CI rebuilds it, and caches it
    # so that happens once per DuckDB version rather than once per run.
    #
    # The key covers the version file AND the build script, because the
    # script decides which extensions are compiled in: bump `CORE_EXTENSIONS`
    # without invalidating the cache and every later run links a library
    # missing the function it needs, failing at *runtime* rather than at
    # link time.
    #
    # SPM-only jobs skip this — PacerCore doesn't link DuckDB, and paying a
    # cold compile there would double the cost of the cheapest job.
    - name: Cache DuckDB XCFramework
      if: inputs.duckdb == 'true'
      id: duckdb-cache
      uses: actions/cache@v6
      with:
        path: Vendor/DuckDB.xcframework
        key: duckdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Vendor/duckdb-version.txt', 'bin/build-duckdb-xcframework.sh') }}

    - name: Build DuckDB XCFramework
      if: inputs.duckdb == 'true' && steps.duckdb-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bin/build-duckdb-xcframework.sh

    # ---- Forecast weights -------------------------------------------------
    # Timestral 5M + 28M (~132 MB), bundled into Pacer.app. Never committed
    # (the 28M file is over GitHub's 100 MB limit); pinned by revision and
    # SHA-256 in the fetch script, which is the cache key, so a re-pin
    # refetches and nothing else does. One cache entry, reused by every run,
    # rather than a download from Hugging Face per run.
    - name: Cache forecast weights
      if: inputs.forecast-weights == 'true'
      uses: actions/cache@v6
      with:
        path: Vendor/ForecastWeights
        key: forecast-weights-${{ hashFiles('bin/fetch-forecast-weights.sh') }}

    - name: Fetch forecast weights
      if: inputs.forecast-weights == 'true'
      shell: bash
      run: bin/fetch-forecast-weights.sh --verify

    - name: Generate Xcode project
      if: inputs.generate-project == 'true'
      shell: bash
      run: xcodegen generate
