name: README screenshots

# Renders docs/screenshots from the app's real window over synthetic data
# (bin/dev-screenshots.sh) and commits them to the branch under review.
#
# The flow this serves: PRs open as drafts; when one is marked ready for
# review, this runs and pushes a "docs: regenerate README screenshots" commit
# onto the PR's own branch, so the images are reviewed in the PR they belong
# to. No artifacts — the repo's artifact and cache space is small and shared,
# and the commit *is* the output.
#
# Why a runner and not a Mac: it builds with the SDK releases use, so the images
# show the chrome users get; nobody is using it, so the window can be key
# (colour traffic lights); and nothing is captured from anyone's screen or
# store. See #128 for the hand-drawn title bar this replaced.
on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # A fork's branch cannot be pushed to with this token.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    # Pinned like ci.yml: the SDK decides the app's appearance.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch itself, not the PR's merge commit — the images are
          # committed onto it.
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      # Restores the existing SPM and DuckDB caches; this job adds none.
      - uses: ./.github/actions/prepare-build

      # Builds (make verify), starts the capture helper on a 2× virtual
      # display, renders every scene. CI=true, set by the runner, selects it.
      #
      # PACER_WIDGET_FIXTURES: the widget extension serves fixture entries,
      # for widgets.png (bin/widgetkit-sim-shots.sh). Compiled in only here,
      # through an xcconfig xcodebuild applies over every target, so no build
      # that ships can show fake numbers.
      - name: Render screenshots
        env:
          # Where the capture helper writes each menu bar shot's rectangles of
          # Pacer's own windows. Not under docs/: they are not README assets.
          PACER_SCREENSHOT_SIDECARS: ${{ runner.temp }}/shot-rects
        run: |
          printf 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) PACER_WIDGET_FIXTURES\n' \
              > "$RUNNER_TEMP/widget-fixtures.xcconfig"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/widget-fixtures.xcconfig" make screenshots

      # The capture pins the system clock to 9:41 while it photographs the menu
      # bar and puts it back itself; this is for the run that died in between.
      # Before anything that needs a true clock (TLS, git push).
      - name: Make sure the clock is real again
        if: always()
        run: sudo sntp -sS time.apple.com || true

      # Lossless: pixels are untouched, only the encoding is tightened. The
      # images are committed on every UI PR and git keeps each version, so
      # their size is the repo's size.
      - name: Compress the images (lossless)
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet oxipng
          du -ch docs/screenshots/*.png | tail -1
          oxipng --quiet -o 4 --strip safe docs/screenshots/*.png
          du -ch docs/screenshots/*.png | tail -1

      # A render re-encodes every image, so one whose pixels did not change
      # still comes out byte-different. Committing it adds a review item and
      # another copy in history for nothing (#154). Put those back, within
      # png-pixels-equal's 2 levels. A menu bar shot is compared only inside
      # Pacer's own windows (its rects.json sidecar): the translucent bar and
      # menu show the desktop, which is not ours to keep identical (#166).
      - name: Keep the committed copy of images whose pixels are unchanged
        run: |
          set -euo pipefail
          swiftc -O -o "$RUNNER_TEMP/png-pixels-equal" bin/png-pixels-equal.swift
          for f in $(git diff --name-only -- 'docs/screenshots/*.png'); do
            git show "HEAD:$f" > "$RUNNER_TEMP/committed.png"
            rects="$RUNNER_TEMP/shot-rects/$(basename "$f" .png).rects.json"
            [ -f "$rects" ] || rects=""
            if "$RUNNER_TEMP/png-pixels-equal" "$RUNNER_TEMP/committed.png" "$f" $rects; then
              git checkout -- "$f"
              echo "pixels unchanged: $f"
            fi
          done

      - name: Commit the images to the branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/screenshots && [ -z "$(git ls-files --others --exclude-standard docs/screenshots)" ]; then
            echo "Screenshots unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs: regenerate README screenshots" \
                     -m "Rendered by .github/workflows/screenshots.yml (run ${GITHUB_RUN_ID}) on macos-26 — the real Pacer window over synthetic data."
          if [ "$BRANCH" = "main" ]; then
            # Never straight onto main: park it on a branch to PR by hand.
            target="automation/readme-screenshots-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/$target"
            echo "::notice::Screenshots pushed to $target — open a PR from it."
          else
            git push origin "HEAD:$BRANCH"
          fi
