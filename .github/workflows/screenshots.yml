name: README screenshots

# Regenerates docs/screenshots from the app's real window over synthetic data
# (bin/dev-screenshots.sh) and opens a PR with the result.
#
# Why here and not on a Mac: the runner builds with the SDK releases are built
# with, so the images show the chrome users get; nobody is using it, so the
# window can be made key (colour traffic lights); and nothing is captured from
# anyone's screen or store. See #128 for how the old hand-drawn title bar
# drifted. Run it from the Actions tab or `gh workflow run screenshots.yml`.
on:
  workflow_dispatch:
  push:
    branches: [feat/real-window-screenshots]   # TEMPORARY — removed before merge

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # Pinned like ci.yml: the SDK decides the app's appearance.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/prepare-build

      # `make screenshots` builds (make verify), starts the capture helper on
      # a 2× virtual display, and renders every scene. CI=true is what selects
      # that path; it is set by the runner.
      - name: Render screenshots
        run: make screenshots
        env:
          PACER_SCREENSHOT_WINDOWS_ONLY: ${{ github.event_name == 'push' && '1' || '' }}   # TEMPORARY

      - uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: docs/screenshots/

      - name: Open a PR with the new images
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/screenshots && [ -z "$(git ls-files --others --exclude-standard docs/screenshots)" ]; then
            echo "Screenshots unchanged — nothing to open."
            exit 0
          fi
          branch="automation/readme-screenshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/screenshots
          git commit -m "docs: regenerate README screenshots" \
                     -m "Rendered by .github/workflows/screenshots.yml (run ${GITHUB_RUN_ID}) from ${GITHUB_SHA}."
          git push origin "$branch"
          # A PR opened with GITHUB_TOKEN does not trigger other workflows, and
          # a repo can forbid Actions from opening PRs at all — the branch and
          # the artifact are there either way.
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "docs: regenerate README screenshots" \
            --body "Regenerated by the [README screenshots workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from ${GITHUB_SHA} — the real Pacer window over synthetic data, captured on a macos-26 runner. Review the images before merging." \
            || echo "::warning::Could not open a PR (Settings → Actions → 'Allow GitHub Actions to create pull requests'). Branch $branch has the images."
