name: Release

# Tag-driven release. Push a `v0.2.0` tag and this workflow builds,
# signs, notarizes, packages, signs the Sparkle update, builds and proves
# Sparkle delta updates from the last three releases, publishes the GitHub
# Release, and updates the appcast on the gh-pages branch.
#
# Delta updates have a kill switch that needs no code change: set the
# repository variable PACER_SPARKLE_DELTAS to `off` (Settings → Secrets and
# variables → Actions → Variables), or pass `deltas: off` to a manual run.
# A release then ships exactly as it did before deltas: one DMG, one
# <enclosure>. Undoing deltas already published: docs/releasing.md,
# "Rolling back delta updates".
#
# Required secrets (configure under Settings → Secrets and variables →
# Actions). See docs/releasing.md for the exact value formats and
# step-by-step setup.
#
#   MACOS_CERTIFICATE         — base64-encoded Developer ID Application
#                                .p12 (exported from Keychain Access).
#   MACOS_CERTIFICATE_PASSWORD — password used when exporting the .p12.
#   KEYCHAIN_PASSWORD          — random password for the ephemeral CI keychain.
#   APPLE_TEAM_ID              — 10-char Team ID (e.g. YZXWMJ5VBY).
#   NOTARY_KEY_ID              — App Store Connect API key ID.
#   NOTARY_ISSUER_ID           — App Store Connect issuer UUID.
#   NOTARY_KEY_P8              — full contents of the .p8 file from
#                                App Store Connect (the actual private key
#                                text, including the BEGIN/END lines).
#   SPARKLE_ED_PRIVATE_KEY     — base64-encoded Sparkle EdDSA private key
#                                (output of `generate_keys -x -`).

on:
  push:
    tags:
      - "v*.*.*"
  # Manual fire-from-the-UI path, useful for verifying the workflow
  # without cutting an actual release. A manual run never publishes a GitHub
  # Release or pushes the appcast (the publish steps run only on a tag push),
  # whatever `dry_run` says. It builds, signs and notarizes, builds the delta
  # updates from the last three releases to this build and verifies and signs
  # them strictly (any failure fails the run), and previews the appcast item
  # it would add against a copy of the live feed. From the CLI:
  #   gh workflow run release.yml --ref <branch> -f dry_run=true
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip GitHub Release + appcast publish (build + sign + notarize only)"
        required: false
        default: "false"
      deltas:
        description: "Build Sparkle delta updates: on or off (the PACER_SPARKLE_DELTAS repo variable can also turn them off)"
        required: false
        default: "on"

# Avoid two release runs racing each other if a tag and a manual dispatch
# fire simultaneously.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create releases, push to gh-pages
  pages: write      # if the user wires up GH Pages publish later

jobs:
  release:
    name: Build, sign, notarize, publish
    # The runner decides the SDK, and from macOS 26 the SDK decides the app's
    # appearance. Pinned to `macos-26` so releases adopt the current design;
    # pinned rather than `macos-latest` because that label moves on GitHub's
    # schedule and this is the one setting that silently restyles the app.
    #
    # `MACOSX_DEPLOYMENT_TARGET` stays 15.0, so this is still a single binary
    # that runs on macOS 15 and up. See docs/liquid-glass-migration.md.
    runs-on: macos-26
    # Normally ~15 min. The ceiling is for Apple: its notary queue took 49 min
    # on 2026-10-06 and a 75-min job was cancelled mid-wait (#189). Each
    # notarization waits at most NOTARY_WAIT (75m) in bin/ci-notarize.sh, so a
    # slow queue ends in a clear message with the submission ID, never a cancel.
    timeout-minutes: 180
    env:
      # Used in several steps; declaring once here keeps them in sync.
      APP_NAME: Pacer
      BUNDLE_ID: com.ericandrechek.pacer

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # Need full history so `git describe` against the tag works
          # for embedding the version into the build (and so we can
          # push to gh-pages at the end without re-fetching).
          fetch-depth: 0

      - name: Resolve release version
        id: version
        # Strip the leading `v` from the tag (`v1.2.3` → `1.2.3`). For
        # workflow_dispatch fires without a tag, fall back to `0.0.0-dev`
        # so the build still has a sane MARKETING_VERSION.
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${version}"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          brew install create-dmg

      - name: Import Developer ID Application cert
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        # Standard GitHub-Actions-on-macOS keychain dance:
        #   1. Decode the base64 .p12 to a temp file.
        #   2. Create an ephemeral keychain just for this job.
        #   3. Import the .p12 with -T /usr/bin/codesign so codesign
        #      can read the private key without an interactive prompt.
        #   4. Add it to the user's search list and set as default.
        # The ephemeral keychain is destroyed in the cleanup step at
        # the end of the job so the cert never persists on the runner.
        run: |
          set -euo pipefail
          CERT_PATH="${RUNNER_TEMP}/cert.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"

          echo "${MACOS_CERTIFICATE}" | base64 --decode > "${CERT_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          security import "${CERT_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"

          # Confirm a Developer ID Application identity is now visible
          # to codesign — fail fast if the secret wasn't loaded.
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
            | grep "Developer ID Application"

      - name: Stamp version into project.yml
        id: stamp
        # Override the in-repo MARKETING_VERSION so the built bundle
        # carries the tag's version (without committing it back).
        run: |
          set -e
          version="${{ steps.version.outputs.version }}"
          # CFBundleVersion (CI build number) is a unix timestamp so every
          # release has a strictly-monotonic build value. Sparkle orders
          # updates by CFBundleVersion (its sparkle:version), NOT by the
          # marketing string — so this `build` value must also become the
          # appcast's <sparkle:version> (see the appcast step). Exposed as a
          # step output so that step can read it.
          build="$(date -u +%s)"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          sed -i.bak -E \
            -e "s/MARKETING_VERSION: \"[^\"]+\"/MARKETING_VERSION: \"${version}\"/g" \
            -e "s/CURRENT_PROJECT_VERSION: \"[^\"]+\"/CURRENT_PROJECT_VERSION: \"${build}\"/g" \
            project.yml
          rm -f project.yml.bak
          grep -E "(MARKETING_VERSION|CURRENT_PROJECT_VERSION)" project.yml

      # XcodeGen + SPM cache. Project generation is left to the step below
      # because it has to run AFTER the version stamp above.
      - uses: ./.github/actions/prepare-build
        with:
          generate-project: "false"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (Release, unsigned)
        # We build unsigned and sign manually below — same pattern as
        # bin/dev-install.sh. xcodebuild's auto-signing wants a
        # provisioning profile registered for the App Groups capability
        # and we don't want to manage profiles in CI.
        run: |
          set -o pipefail
          xcodebuild \
            -project Pacer.xcodeproj \
            -scheme Pacer \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | (xcbeautify --renderer github-actions || cat)

      - name: Upload debug symbols to Sentry
        # Crash reports from this release are symbolicated against these
        # dSYMs (docs/telemetry-plan.md). The release string is read from the
        # built app, so it is exactly what TelemetryController reports.
        # Skipped on dry runs and when the secret is absent (forks); never
        # fails the release: without it, crashes arrive unsymbolicated.
        if: github.event_name == 'push' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ericandrechek
          SENTRY_PROJECT: pacer
          SENTRY_CLI_VERSION: 3.8.2
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN not set; skipping dSYM upload"
            exit 0
          fi
          export INSTALL_DIR="${RUNNER_TEMP}/sentry-cli"
          mkdir -p "${INSTALL_DIR}"
          curl -sSfL https://sentry.io/get-cli/ | sh
          export PATH="${INSTALL_DIR}:${PATH}"
          sentry-cli --version

          APP="$(find build -name "Pacer.app" -path "*/Build/Products/Release/*" | head -1)"
          PRODUCTS="$(dirname "${APP}")"
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP}/Contents/Info.plist")"
          RELEASE="com.ericandrechek.pacer@${VER}+${BUILD}"
          echo "Release ${RELEASE}; dSYMs:"
          find "${PRODUCTS}" -maxdepth 1 -name "*.dSYM"

          sentry-cli debug-files upload --wait "${PRODUCTS}"
          sentry-cli releases new "${RELEASE}"
          sentry-cli releases set-commits "${RELEASE}" --local || \
            echo "::warning::set-commits failed; suspect commits will be missing"
          sentry-cli releases finalize "${RELEASE}"

      - name: Sign the bundle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Reuses the same inside-out signing order as bin/dev-install.sh:
        # frameworks (Sparkle XPC services + helper + framework) first,
        # then resource bundles, then the widget extension, finally the
        # outer app bundle so its seal covers everything inside.
        run: |
          set -euo pipefail
          APP_PATH="$(find build -name "Pacer.app" -path "*/Build/Products/Release/*" | head -1)"
          if [ -z "${APP_PATH}" ] || [ ! -d "${APP_PATH}" ]; then
            echo "ERROR: could not locate built Pacer.app under build/"
            find build -name "Pacer.app" -type d
            exit 1
          fi
          echo "App at: ${APP_PATH}"

          IDENTITY="Developer ID Application: Eric Andrechek (${APPLE_TEAM_ID})"
          APP_ENT="App/Pacer.entitlements"
          WIDGET_ENT="Widgets/PacerWidgets.entitlements"
          CLI_ENT="CLI/pacer.entitlements"

          sign() {
            local ent="$1" target="$2"
            local args=(--force --options runtime --timestamp --sign "${IDENTITY}")
            [ -n "${ent}" ] && args+=(--entitlements "${ent}")
            codesign "${args[@]}" "${target}"
          }

          # Sparkle internals (deepest-first).
          SPARKLE="${APP_PATH}/Contents/Frameworks/Sparkle.framework"
          if [ -d "${SPARKLE}" ]; then
            while IFS= read -r xpc; do
              xpc_name="$(basename "${xpc}" .xpc)"
              [ -e "${xpc}/Contents/MacOS/${xpc_name}" ] && \
                sign "" "${xpc}/Contents/MacOS/${xpc_name}"
              sign "" "${xpc}"
            done < <(find "${SPARKLE}" -name "*.xpc" -type d)
            for helper in \
              "${SPARKLE}/Versions/Current/Autoupdate" \
              "${SPARKLE}/Versions/Current/Updater.app"; do
              [ -e "${helper}" ] && sign "" "${helper}"
            done
            sign "" "${SPARKLE}"
          fi

          # Every other embedded framework (Sentry, since the telemetry work).
          # Plain frameworks with no nested helpers: one signature each. An
          # unsigned framework fails notarization, so a new package that
          # embeds one is covered without remembering to come back here.
          while IFS= read -r fw; do
            [ "$(basename "${fw}")" = "Sparkle.framework" ] && continue
            sign "" "${fw}"
          done < <(find "${APP_PATH}/Contents/Frameworks" -maxdepth 1 -name "*.framework" -type d)

          # Any other dylibs Xcode emitted (PacerCore products, etc).
          while IFS= read -r dylib; do
            [ -e "${dylib}" ] && sign "" "${dylib}"
          done < <(find "${APP_PATH}" -name "*.dylib" -type f)

          # Resource bundles.
          for bundle in \
            "${APP_PATH}/Contents/Resources/PacerCore_PacerCore.bundle" \
            "${APP_PATH}/Contents/PlugIns/PacerWidgets.appex/Contents/Resources/PacerCore_PacerCore.bundle"; do
            [ -e "${bundle}" ] && sign "" "${bundle}"
          done

          # Widget extension.
          sign "${WIDGET_ENT}" "${APP_PATH}/Contents/PlugIns/PacerWidgets.appex/Contents/MacOS/PacerWidgets"
          sign "${WIDGET_ENT}" "${APP_PATH}/Contents/PlugIns/PacerWidgets.appex"

          # The `pacer` command line (#194), with its own App Group
          # entitlement so it can read the store with the local API off.
          # Required, not optional: a release without it would ship a skill
          # shim with nothing to run.
          CLI_APP="${APP_PATH}/Contents/Helpers/PacerCLI.app"
          [ -e "${CLI_APP}/Contents/Resources/PacerCore_PacerCore.bundle" ] && \
            sign "" "${CLI_APP}/Contents/Resources/PacerCore_PacerCore.bundle"
          sign "${CLI_ENT}" "${CLI_APP}"

          # Outer app bundle.
          sign "${APP_ENT}" "${APP_PATH}"

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          codesign --verify --strict --verbose=2 "${APP_PATH}/Contents/Helpers/PacerCLI.app"
          echo "APP_PATH=${APP_PATH}" >> "${GITHUB_ENV}"

      - name: Build DMG
        # `create-dmg` is the gold-standard CLI for building a signed
        # macOS DMG with a styled background + drag-to-Applications
        # affordance. It signs the DMG itself if we pass --codesign,
        # though we re-sign manually below so the entitlements file
        # is consistent with what Sparkle's installer expects.
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          DMG_PATH="${RUNNER_TEMP}/Pacer-${version}.dmg"

          create-dmg \
            --volname "Pacer ${version}" \
            --window-pos 200 120 \
            --window-size 600 380 \
            --icon-size 100 \
            --icon "Pacer.app" 175 190 \
            --hide-extension "Pacer.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            "${DMG_PATH}" \
            "${APP_PATH}" \
            || true   # create-dmg returns non-zero on certain warnings; we re-check below

          if [ ! -f "${DMG_PATH}" ]; then
            echo "::error::DMG was not produced"
            exit 1
          fi
          echo "DMG_PATH=${DMG_PATH}" >> "${GITHUB_ENV}"
          echo "DMG_NAME=Pacer-${version}.dmg" >> "${GITHUB_ENV}"

      - name: Sign + notarize DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        # One notarization, of the outermost container. Apple's guidance:
        # sign inside-out, then notarize and staple the outermost container.
        # The notary service issues tickets for every nested item, and the
        # ticket stapled to the DMG covers the app inside, taken in when the
        # DMG is first opened. The app used to be notarized and stapled on its
        # own first, which doubled the time in Apple's queue (#189).
        # Notarized via App Store Connect API key, the only flow that works in
        # CI. bin/ci-notarize.sh puts the submission ID on the run page, waits
        # with its own limit, and fails with Apple's log on a rejection.
        run: |
          set -euo pipefail
          IDENTITY="Developer ID Application: Eric Andrechek (${APPLE_TEAM_ID})"
          codesign --force --sign "${IDENTITY}" --timestamp "${DMG_PATH}"

          export NOTARY_KEY_PATH="${RUNNER_TEMP}/notary-key.p8"
          echo "${NOTARY_KEY_P8}" > "${NOTARY_KEY_PATH}"
          bin/ci-notarize.sh "${DMG_PATH}" dmg

          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"

          # The app inside must assess as notarized too: that's the claim
          # the single submission rests on, so check it rather than trust it.
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "${MNT}" "${DMG_PATH}" >/dev/null
          verdict="$(spctl --assess --type execute --verbose=2 "${MNT}/Pacer.app" 2>&1 || true)"
          hdiutil detach "${MNT}" >/dev/null || true
          echo "${verdict}"
          if ! grep -q 'source=Notarized Developer ID' <<<"${verdict}"; then
            echo "::error::The app inside the notarized DMG does not assess as notarized: ${verdict}"
            exit 1
          fi

      - name: Sign Sparkle update
        id: sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        # Sparkle's `sign_update` ships inside the Sparkle SPM checkout
        # under `bin/`. After xcodegen + xcodebuild, the resolved package
        # lives under build/SourcePackages/checkouts/Sparkle.
        run: |
          set -euo pipefail
          # The EdDSA `sign_update` we need is a PREBUILT binary inside the
          # Sparkle artifact bundle, NOT in the source checkout. The source
          # checkout's bin/ only carries the legacy DSA shell script
          # (bin/old_dsa_scripts/sign_update), which rejects the `-f
          # <keyfile>` EdDSA args and exits 1. The real tool lives at
          # SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update. Search
          # the whole SourcePackages tree for */Sparkle/bin/sign_update and
          # exclude old_dsa_scripts so we land on the EdDSA binary.
          SIGN_UPDATE="$(find build/SourcePackages -path '*/Sparkle/bin/sign_update' -not -path '*old_dsa_scripts*' | head -1)"
          if [ -z "${SIGN_UPDATE}" ] || [ ! -x "${SIGN_UPDATE}" ]; then
            echo "::error::Could not locate Sparkle's sign_update tool"
            find build -name sign_update 2>/dev/null | head -5
            exit 1
          fi
          echo "Using ${SIGN_UPDATE}"

          KEY_FILE="${RUNNER_TEMP}/sparkle.key"
          echo "${SPARKLE_ED_PRIVATE_KEY}" > "${KEY_FILE}"

          # `sign_update -f <keyfile> <dmg>` emits both an
          # `sparkle:edSignature="..."` AND a `length="..."` attribute. The
          # appcast <enclosure> template already sets length="${size}" from
          # stat, so keep only the edSignature here — otherwise the rendered
          # enclosure has `length` twice, which is malformed XML ("Attribute
          # length redefined") and Sparkle rejects the whole feed.
          SIGNATURE="$("${SIGN_UPDATE}" -f "${KEY_FILE}" "${DMG_PATH}" | sed -E 's/[[:space:]]*length="[0-9]+"//')"
          echo "signature=${SIGNATURE}" >> "${GITHUB_OUTPUT}"

          SIZE="$(stat -f%z "${DMG_PATH}")"
          echo "size=${SIZE}" >> "${GITHUB_OUTPUT}"

      - name: Build Sparkle delta updates
        id: deltas
        # Kill switch: the PACER_SPARKLE_DELTAS repo variable or the `deltas`
        # input set to `off` skips this step, and with no deltas built the
        # release and appcast steps below do exactly what they did before.
        if: vars.PACER_SPARKLE_DELTAS != 'off' && github.event.inputs.deltas != 'off'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        # bin/sparkle-deltas.sh diffs each of the last three releases' apps
        # (from their published DMGs) against the app in the DMG just
        # notarized, applies every delta to a fresh copy of the old app and
        # requires the result to match the new app file for file, pass
        # codesign --deep --strict and assess as notarized, and only then signs
        # it and checks the signature against the old app's SUPublicEDKey.
        #
        # On a tag push a failure costs only the delta: the release ships with
        # the full DMG, as before, and a warning says why. A manual run is the
        # test of all this, so there it is strict and any failure fails the run.
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          SIGN_UPDATE="$(find build/SourcePackages -path '*/Sparkle/bin/sign_update' -not -path '*old_dsa_scripts*' | head -1)"
          KEY_FILE="${RUNNER_TEMP}/sparkle.key"
          echo "${SPARKLE_ED_PRIVATE_KEY}" > "${KEY_FILE}"
          DELTAS_DIR="${RUNNER_TEMP}/deltas"

          args=(--new "${DMG_PATH}" --out "${DELTAS_DIR}" --version "${version}" --key-file "${KEY_FILE}")
          if [ -n "${SIGN_UPDATE}" ]; then args+=(--sparkle-bin "$(dirname "${SIGN_UPDATE}")"); fi
          strict=no
          if [ "${GITHUB_EVENT_NAME}" != push ]; then args+=(--strict); strict=yes; fi

          rc=0
          bin/sparkle-deltas.sh "${args[@]}" || rc=$?
          if [ "${rc}" != 0 ]; then
            if [ "${strict}" = yes ]; then
              echo "::error title=Sparkle deltas::bin/sparkle-deltas.sh exited ${rc}; see the log above"
              exit 1
            fi
            echo "::warning title=Sparkle deltas::bin/sparkle-deltas.sh exited ${rc}; releasing without delta updates"
            rm -rf "${DELTAS_DIR}"
          fi

          count=0
          if [ -s "${DELTAS_DIR}/deltas.xml" ]; then
            count="$(find "${DELTAS_DIR}" -maxdepth 1 -name '*.delta' | wc -l | tr -d ' ')"
          fi
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "DELTAS_DIR=${DELTAS_DIR}" >> "${GITHUB_ENV}"
          echo "Delta updates ready to publish: ${count}"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"

          # Create-or-update the release.
          #
          # `--generate-notes` builds the body from merged PULL REQUESTS, not
          # commits — so it renders an empty "What's Changed" whenever work
          # lands straight on main, which is most of the time here. Four
          # releases shipped with notes that said nothing at all, one of them
          # carrying a change that moved every user's reported output tokens
          # by ~30%. Silence is the worst possible note for that.
          #
          # So: use the generated notes when they actually contain something,
          # and otherwise fall back to the commit subjects since the previous
          # tag, which is where the real description lives in this repo.
          prev_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          gh api --method POST "repos/{owner}/{repo}/releases/generate-notes" \
            -f tag_name="${tag}" -f target_commitish=main \
            ${prev_tag:+-f previous_tag_name="${prev_tag}"} \
            --jq '.body' > "${notes_file}" 2>/dev/null || : > "${notes_file}"

          # A hand-written file wins over anything generated. Generated notes
          # describe what CHANGED IN THE REPO; a release note should say what
          # changed FOR THE USER, and only a human (or an agent that just did
          # the work) can write that. Checked in, so it is reviewable in the
          # PR that ships the change and can't be lost in a UI edit afterwards.
          authored="docs/release-notes/${tag#v}.md"
          if [ -f "${authored}" ]; then
            echo "using authored notes: ${authored}"
            cp "${authored}" "${notes_file}"
          elif ! grep -q '^\* ' "${notes_file}"; then
            echo "generated notes list no PRs — falling back to commit subjects"
            {
              echo "## What's Changed"
              echo
              if [ -n "${prev_tag}" ]; then
                git log --no-merges --format='* %s' "${prev_tag}..${tag}"
                echo
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${tag}"
              else
                git log --no-merges --format='* %s' "${tag}"
              fi
            } > "${notes_file}"
          fi

          # The delta updates go up with the DMG, before the appcast step can
          # name them, so no client is ever pointed at an asset that is not
          # there yet.
          assets=("${DMG_PATH}")
          if [ "${{ steps.deltas.outputs.count || '0' }}" != 0 ]; then
            for delta in "${DELTAS_DIR}"/*.delta; do assets+=("${delta}"); done
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --title "Pacer ${version}" \
              --notes-file "${notes_file}" \
              --verify-tag
          fi

      - name: Update appcast on gh-pages
        if: github.event_name == 'push' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Maintain a single appcast.xml at the root of the gh-pages
        # branch, served from https://ericandrechek.github.io/Pacer/appcast.xml
        # (the SUFeedURL declared in Info.plist).
        #
        # The first run on a repo that has no gh-pages branch yet
        # bootstraps an empty appcast.xml; subsequent runs append.
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          build="${{ steps.stamp.outputs.build }}"             # CFBundleVersion of this build (unix ts)
          signature='${{ steps.sparkle.outputs.signature }}'   # e.g. sparkle:edSignature="..."
          size='${{ steps.sparkle.outputs.size }}'
          pubdate="$(LC_TIME=en_US.UTF-8 date -u +"%a, %d %b %Y %H:%M:%S +0000")"
          dmg_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${DMG_NAME}"

          # Release notes for Sparkle's update dialog. Mirror the GitHub
          # Release body (the same `--generate-notes` content) by rendering
          # it to HTML through GitHub's own markdown API, then embed it as
          # the item's <description> (Sparkle shows that HTML in the
          # "what's new" pane). Defensive: any failure leaves the
          # description empty rather than breaking appcast generation — a
          # missing "what's new" is cosmetic, a malformed appcast is not.
          item_args=(--version "${version}" --build "${build}" --pubdate "${pubdate}"
                     --url "${dmg_url}" --length "${size}" --signature "${signature}")
          if body="$(gh release view "v${version}" --json body -q .body 2>/dev/null)" && [ -n "${body}" ]; then
            printf '%s' "${body}" > "${RUNNER_TEMP}/notes.md"
            if notes_html="$(gh api --method POST /markdown -f mode=gfm -F text=@"${RUNNER_TEMP}/notes.md" 2>/dev/null)" \
               && [ -n "${notes_html}" ]; then
              printf '%s' "${notes_html}" > "${RUNNER_TEMP}/notes.html"
              item_args+=(--description-file "${RUNNER_TEMP}/notes.html")
            fi
          fi

          # Delta updates, when the delta step built any. The release's own
          # asset list goes in too: a delta the feed names must be an asset
          # of this release with exactly the length the feed gives it, or the
          # item is written without deltas (bin/appcast-add-item.py).
          if [ -s "${DELTAS_DIR:-/nonexistent}/deltas.xml" ]; then
            gh release view "v${version}" --json assets > "${RUNNER_TEMP}/release-assets.json"
            item_args+=(--deltas-file "${DELTAS_DIR}/deltas.xml" --release-assets "${RUNNER_TEMP}/release-assets.json")
          fi

          # Check out gh-pages (create if absent).
          worktree="${RUNNER_TEMP}/gh-pages"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/gh-pages" >/dev/null 2>&1; then
            git worktree add -B gh-pages "${worktree}" origin/gh-pages
          else
            # --orphan checks out an unborn branch, so the working tree is
            # already empty (only the .git link file). Do NOT `rm -rf .* *`
            # here: the .* glob matches .git and destroys the worktree link,
            # which made every later git command fail with "not a git
            # repository" (the v0.1.0 appcast bootstrap hit exactly this).
            git worktree add --orphan -B gh-pages "${worktree}"
          fi

          appcast="${worktree}/appcast.xml"
          if [ ! -f "${appcast}" ]; then
            cat > "${appcast}" <<'HEADER'
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Pacer</title>
                  <link>https://ericandrechek.github.io/Pacer/appcast.xml</link>
                  <description>Pacer auto-update feed</description>
                  <language>en</language>
              </channel>
          </rss>
          HEADER
          fi

          # Insert the new item right before the closing </channel>. The
          # script writes the item exactly as the inline template here used
          # to, checks the whole feed still parses with the new item intact,
          # and falls back to the item without deltas rather than write a
          # feed that fails that check.
          python3 -I "${GITHUB_WORKSPACE}/bin/appcast-add-item.py" --appcast "${appcast}" "${item_args[@]}"

          # The curated, dated price history rides along: the app refreshes it
          # from beside the appcast (CuratedPriceHistory.remoteURL) and falls
          # back to the copy bundled in the release it ships with.
          cp "${GITHUB_WORKSPACE}/PacerCore/Sources/PacerCore/Resources/price-history.json" \
             "${worktree}/price-history.json"

          (
            cd "${worktree}"
            git add appcast.xml price-history.json
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "appcast: ${version}"
            git push origin gh-pages
          )

      - name: Preview the appcast (dry run)
        # Runs exactly when the two publish steps above do not. Adds this
        # build's item to a COPY of the live feed with the same script the
        # appcast step uses, as if the deltas were already uploaded, and then
        # applies the undo (bin/appcast-drop-deltas.sh) to that copy and
        # requires the result to equal the item rendered without deltas. The
        # live feed and gh-pages are only read.
        if: "!(github.event_name == 'push' && github.event.inputs.dry_run != 'true')"
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          build="${{ steps.stamp.outputs.build }}"
          signature='${{ steps.sparkle.outputs.signature }}'
          size='${{ steps.sparkle.outputs.size }}'
          pubdate="$(LC_TIME=en_US.UTF-8 date -u +"%a, %d %b %Y %H:%M:%S +0000")"
          dmg_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${DMG_NAME}"
          P="${RUNNER_TEMP}/appcast-preview"
          mkdir -p "${P}"
          curl -fsSL -o "${P}/live.xml" https://ericandrechek.github.io/Pacer/appcast.xml

          item_args=(--version "${version}" --build "${build}" --pubdate "${pubdate}"
                     --url "${dmg_url}" --length "${size}" --signature "${signature}")
          python3 -I bin/appcast-add-item.py --appcast "${P}/live.xml" --out "${P}/plain.xml" "${item_args[@]}"

          if [ -s "${DELTAS_DIR:-/nonexistent}/deltas.xml" ]; then
            # The asset list the release would have: the DMG and the deltas.
            python3 -I - "${P}/assets.json" "${DMG_PATH}" "${DELTAS_DIR}"/*.delta <<'PY'
          import json, os, sys
          json.dump({"assets": [{"name": os.path.basename(f), "size": os.path.getsize(f)} for f in sys.argv[2:]]},
                    open(sys.argv[1], "w"))
          PY
            python3 -I bin/appcast-add-item.py --appcast "${P}/live.xml" --out "${P}/with-deltas.xml" "${item_args[@]}" \
              --deltas-file "${DELTAS_DIR}/deltas.xml" --release-assets "${P}/assets.json" | tee "${P}/add.log"
            grep -q "deltas_in_appcast=${{ steps.deltas.outputs.count || '0' }}$" "${P}/add.log" \
              || { echo "::error::the previewed item does not carry every delta built"; exit 1; }

            bin/appcast-drop-deltas.sh "${version}" "${P}/with-deltas.xml" "${P}/dropped.xml"
            cmp "${P}/dropped.xml" "${P}/plain.xml" \
              || { echo "::error::dropping the deltas did not give back the plain item"; exit 1; }
            echo "Undo checked: dropping ${version}'s deltas gives back the item without them, byte for byte."
            preview="${P}/with-deltas.xml"
          else
            echo "No delta updates were built; the item is the plain one."
            preview="${P}/plain.xml"
          fi

          {
            echo "### Appcast item this run would add (not published)"
            echo
            echo '```xml'
            python3 -I - "${preview}" "${version}" "${build}" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          items = re.findall(r"<item>.*?</item>", text, re.S)
          mine = [i for i in items if f">{sys.argv[2]}<" in i and f">{sys.argv[3]}<" in i]
          print(mine[-1] if mine else "(item not found)")
          PY
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Clean up ephemeral keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/build.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/notary-key.p8" "${RUNNER_TEMP}/sparkle.key"
