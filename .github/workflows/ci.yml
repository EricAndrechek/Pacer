name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref on new pushes — saves runner
# minutes while iterating.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacercore-test:
    # Two runner images on purpose, not one.
    #
    # macOS 26 changed Foundation behaviour the source can't see: URL
    # directory-ness is now decided by consulting the filesystem, so a
    # directory URL's trailing slash — and therefore `URL` equality —
    # depends on how and when it was built. That silently broke the
    # duplicate-root guard in `ScanCoordinator.resolveAllRoots()`, and
    # macos-15 could not have caught it: the old Foundation agrees with
    # itself. Matrix-testing both is the only way this class of
    # divergence fails in CI rather than on a user's Mac.
    #
    # macos-15 is not legacy coverage to drop once 26 is the default —
    # it is the oldest OS Pacer supports, and the deployment target is
    # still 15.0.
    name: PacerCore tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One image failing should not hide the other's result — the
      # interesting output is usually *which* of the two disagreed.
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # PacerCore is pure SPM — no Xcode project needed, just a warm package
      # cache so Sparkle isn't refetched every run. Keyed on the image as
      # well: the two runners ship different Swift versions and must not
      # restore each other's build products.
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            PacerCore/.build
          key: spm-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('PacerCore/Package.swift', 'PacerCore/Package.resolved') }}
          restore-keys: |
            spm-${{ matrix.os }}-${{ runner.arch }}-

      # Standalone SPM package — no Xcode project required for the
      # PacerCore + PacerUI tests. Runs in well under a minute on the
      # standard runner. The forecast-model port suites run in their own job
      # (arena-models, below): beside everything else on a 3-core runner they
      # starved timing-sensitive tests and pushed this job past its timeout.
      - name: Run PacerCore tests
        working-directory: PacerCore
        run: swift test --parallel --skip "$(../bin/arena-model-tests.sh)"

  arena-models:
    # The on-device forecast models (Forecast/Arena) against the arena's
    # parity fixtures: networks, Monte-Carlo models and their ensembles, which
    # are CPU-heavy in a Debug build. On both images, like the job above: it
    # skips these suites, so this is the only place the networks run, and
    # Pacer ships one binary to macOS 15 and up. The models are arithmetic,
    # but the weight store and the runtime go through Foundation, whose
    # behaviour has moved between releases (URL directory-ness, AGENTS.md).
    # The bundled Timestral networks are fetched (pinned, SHA-256 checked) so
    # their parity runs too; the downloaded sizes skip without their weights.
    name: Forecast model parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v5

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            PacerCore/.build
          key: spm-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('PacerCore/Package.swift', 'PacerCore/Package.resolved') }}
          restore-keys: |
            spm-${{ matrix.os }}-${{ runner.arch }}-

      - name: Cache forecast weights
        uses: actions/cache@v6
        with:
          path: Vendor/ForecastWeights
          key: forecast-weights-${{ hashFiles('bin/fetch-forecast-weights.sh') }}

      - name: Fetch forecast weights
        run: bin/fetch-forecast-weights.sh --verify

      - name: Run forecast model tests
        working-directory: PacerCore
        run: swift test --parallel --filter "$(../bin/arena-model-tests.sh)"

  app-build:
    name: App + widgets verify build
    # Matches the runner `release.yml` builds on, so the verify build compiles
    # against the same SDK that ships. That is the point of the pin: the SDK a
    # binary links decides its appearance from macOS 26 on, and Pacer adopts
    # the current design rather than staying on the old one. It does NOT
    # decide compatibility — `MACOSX_DEPLOYMENT_TARGET` is 15.0 and the macOS
    # 26 SDK's own floor is well below that, so one binary still serves
    # macOS 15 users, who see no change because their AppKit has no new design
    # to draw.
    #
    # Deliberately NOT `macos-latest`: that label moves on GitHub's schedule,
    # and an app's appearance is not something to let drift silently.
    runs-on: macos-26
    # 25 was right when the only compile was Pacer's own. A DuckDB cache miss
    # builds the engine from source, which does not fit in it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Fails fast, before the long build. Compiler intermediates carry absolute
      # build paths, and 400 of them were once committed by accident (#309).
      - name: No tracked compiler intermediates
        run: |
          if git ls-files | grep -E '\.(o|d|dia|swiftdeps|swiftconstvalues)$'; then
            echo "::error::Compiler intermediates are tracked (listed above). git rm --cached them; see #309."
            exit 1
          fi

      - name: Show toolchain
        run: xcodebuild -version

      # XcodeGen (pinned prebuilt, not brew) + SPM cache + project generation,
      # shared with the release workflow so the two can't drift.
      - uses: ./.github/actions/prepare-build

      # Unsigned compile-only build — same flags `make verify` uses
      # locally. We don't run signed builds in CI because the Developer
      # ID cert lives on the maintainer's machine; signed + notarized
      # builds happen in a release workflow (TBD).
      #
      # `xcbeautify` is preinstalled on the macos-15 runner image; if
      # that ever changes the `|| cat` fallback keeps the build's exit
      # code authoritative without losing log lines.
      - name: Build Pacer.app
        run: |
          set -o pipefail
          xcodebuild \
            -project Pacer.xcodeproj \
            -scheme Pacer \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | (xcbeautify --renderer github-actions || cat)

      - name: Build PacerWidgets.appex
        run: |
          set -o pipefail
          xcodebuild \
            -project Pacer.xcodeproj \
            -scheme PacerWidgets \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | (xcbeautify --renderer github-actions || cat)

      # The line parser and the DuckDB bulk importer must leave the same rows
      # from the same transcripts (#334). PacerCore's own job can't run the
      # comparison — PacerCore doesn't link DuckDB — so it runs here, where
      # prepare-build has already restored the framework. A throwaway package,
      # no cache and no artifacts of its own.
      - name: Ingest parity (line parser vs bulk importer)
        run: bin/dev-ingest-parity.sh --fixtures
